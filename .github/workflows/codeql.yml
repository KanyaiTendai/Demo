name: CodeQL

# Static analysis of the C# source. It compiles the solution but never runs the tests,
# so it makes no calls to the PayPal APIs and needs no secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC, to catch newly published query rules
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: Analyze (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write # upload results to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # Manual build so CodeQL also sees the code Reqnroll generates from the .feature files.
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: dotnet build Demo.sln -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
