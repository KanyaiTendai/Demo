name: Test and Deploy

# Runs the Reqnroll/Playwright API suite and CodeQL on every pull request into main.
# If the suite passes and CodeQL finds no critical or high security alerts, the Deploy stage
# enables auto-merge so the PR lands in main once
# branch protection (reviews + the required "Test" check) is satisfied.
# Pushes to main and the weekly schedule run CodeQL only, never the tests.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC, to catch newly published CodeQL rules
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Test
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tests run for pull requests and manual runs only. Secrets are not passed to pull requests
    # from forks, so skip those rather than run without credentials.
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    outputs:
      # True once the suite has started, so the report job can skip runs that failed before any tests ran.
      tests-ran: ${{ steps.started.outputs.ran }}
    # PayPal secrets are deliberately NOT set here: job-level env would hand them to every step,
    # including restore and build, where NuGet packages can run their own MSBuild code. They are
    # passed only to the steps that need them.
    env:
      PAYPAL_BASE_URL: ${{ vars.PAYPAL_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      # Without credentials the scenarios end as Inconclusive, which dotnet test reports as a pass.
      # Fail here so a misconfigured pipeline can never auto-merge untested code.
      - name: Verify credentials are configured
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          if [ -z "$PAYPAL_CLIENT_ID" ] || [ -z "$PAYPAL_CLIENT_SECRET" ]; then
            echo "::error::PAYPAL_CLIENT_ID and PAYPAL_CLIENT_SECRET secrets must be set (Dependabot PRs read them from the separate Dependabot secrets)."
            exit 1
          fi

      # A folder that had its own .git when it was committed is pushed as a pointer with no files,
      # so the projects the solution references are missing from the checkout.
      - name: Verify project files are present
        run: |
          missing=0
          for sln in *.sln; do
            [ -e "$sln" ] || continue
            for proj in $(grep -oE '"[^"]+\.csproj"' "$sln" | tr -d '"' | tr '\\' '/'); do
              if [ ! -f "$proj" ]; then
                echo "::error file=$sln::$sln references $proj, but it is not in the repository. If its folder shows as an un-openable '@ <sha>' entry on GitHub, it was committed as a nested git repo: remove that folder's .git, then re-add and push its files."
                missing=1
              fi
            done
          done
          exit $missing

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c "$CONFIGURATION"

      - name: Mark tests as started
        id: started
        run: echo "ran=true" >> "$GITHUB_OUTPUT"

      # Scenarios tagged @known-issue document defects in the API under test (not in this code).
      # They are also tagged @ignore, so Reqnroll skips them in every run; this filter is a second
      # safeguard so they can never block a PR.
      - name: Run tests
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: >
          dotnet test --no-build -c "$CONFIGURATION"
          --filter "Category!=known-issue"
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Collect Allure results
        if: always()
        run: |
          mkdir -p allure-results-out
          find . -type d -name allure-results -not -path './allure-results-out/*' \
            -exec sh -c 'cp -r "$1"/. allure-results-out/' _ {} \;

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results
          path: allure-results-out
          if-no-files-found: warn
          retention-days: 14

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trx-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # CodeQL: static analysis of the C# source, in parallel with Test. It compiles the solution
  # but never runs the tests, so it makes no PayPal calls and needs no secrets.
  # Requires the repo's CodeQL "default setup" to be off (Settings > Code security), because
  # GitHub rejects results from a workflow while default setup is enabled.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
      security-events: write # upload results to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: csharp
          # Manual build so CodeQL also sees the code Reqnroll generates from the .feature files
          # (scanned for security alerts; its code quality findings are filtered out below).
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: dotnet build Demo.sln -c "$CONFIGURATION"

      # Uploaded below, after filtering, so the Security tab, the Allure summary and the severity
      # gate all see the same results.
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:csharp
          output: sarif-results
          upload: never

      # Reqnroll's generated .feature.cs code produces code quality findings (e.g. useless upcasts)
      # that can't be fixed in this project. paths-ignore doesn't apply to compiled languages, so
      # they are removed from the SARIF instead. Security alerts in generated code are kept.
      - name: Remove code quality findings in generated code
        run: python3 .github/scripts/codeql_allure_summary.py --filter-generated sarif-results

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif-results
          category: /language:csharp

      # Kept for the Allure summary even if the upload to the Security tab fails.
      - name: Upload SARIF for the Allure summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: sarif-results
          if-no-files-found: ignore
          retention-days: 14

      # Severity gate: fails this job on any critical or high security alert, which stops Deploy
      # from enabling auto-merge. Medium/low alerts and code quality notes don't block.
      - name: Check security severity
        run: python3 .github/scripts/codeql_allure_summary.py --check sarif-results

  # ---------------------------------------------------------------------------
  # Allure report: runs whether the tests passed or failed, so failures can be investigated.
  # Includes a CodeQL summary alongside the test results: security alerts as counts only,
  # code quality findings broken down by rule and file.
  # This job installs and runs third-party tools (the Allure CLI from npm), so it only gets a
  # read-only token. Publishing is done by the separate publish job, which runs no third-party code.
  # ---------------------------------------------------------------------------
  report:
    name: Allure Report
    needs: [test, codeql]
    # Skip when Test failed before the suite started (e.g. missing secrets): there are no results to report.
    if: >
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'failure') &&
      needs.test.outputs.tests-ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allure-results
          path: allure-results

      # Missing when the CodeQL job failed early; the summary then shows as "broken".
      - name: Download CodeQL results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codeql-sarif
          path: codeql-sarif

      - name: Checkout pipeline scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Add CodeQL summary to Allure results
        id: codeql
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERTS_QUERY: ${{ github.event_name == 'pull_request' && format('pr:{0}', github.event.pull_request.number) || format('branch:{0}', github.ref_name) }}
        run: |
          ALERTS_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/security/code-scanning?query=is:open+${ALERTS_QUERY}"
          summary=$(python3 src/.github/scripts/codeql_allure_summary.py \
            codeql-sarif allure-results "$ALERTS_URL" "$RUN_URL")
          echo "$summary"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      # Only the trend history is needed from the published site. The checkout keeps no credentials,
      # and this job's token is read-only anyway.
      - name: Fetch trend history from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages > /dev/null 2>&1; then
            git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
              clone --depth 1 --branch gh-pages --single-branch "https://github.com/${GITHUB_REPOSITORY}.git" previous
          fi
          if [ -d previous/latest/history ]; then
            cp -r previous/latest/history allure-results/history
          fi

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # --ignore-scripts: install-time scripts are how npm supply-chain worms steal CI credentials.
      # The Allure CLI is a Java app in the package and needs no install scripts.
      - name: Install Allure CLI
        run: npm install --global --ignore-scripts allure-commandline@2.46.1

      - name: Add executor and environment info
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_URL: ${{ vars.PAYPAL_BASE_URL || 'https://api-m.sandbox.paypal.com' }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPORT_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/runs/${GITHUB_RUN_NUMBER}/"

          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}",
            "buildOrder": ${GITHUB_RUN_NUMBER},
            "buildUrl": "${RUN_URL}",
            "reportUrl": "${REPORT_URL}"
          }
          EOF

          # Non-secret context only: never write credentials or tokens here.
          cat > allure-results/environment.properties <<EOF
          Branch=${BRANCH}
          Commit=${COMMIT}
          API.BaseUrl=${BASE_URL}
          Runner=${RUNNER_OS}
          EOF

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      # The multi-file report loads its data with fetch(), which browsers block for file:// pages,
      # so a downloaded copy shows no data. The single-file report embeds everything in one HTML file
      # and opens directly from disk.
      - name: Generate single-file Allure report
        run: |
          allure generate allure-results --clean --single-file -o allure-report-single
          mv allure-report-single/index.html allure-report.html

      - name: Upload single-file Allure report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: allure-report.html
          archive: false
          retention-days: 30

      # Handed to the publish job, which pushes it to gh-pages.
      - name: Upload report for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report-site
          path: allure-report
          retention-days: 1

      - name: Write job summary
        env:
          TEST_RESULT: ${{ needs.test.result }}
          CODEQL_SUMMARY: ${{ steps.codeql.outputs.summary }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          {
            echo "### Allure report"
            echo ""
            echo "- Test result: **${TEST_RESULT}**"
            echo "- ${CODEQL_SUMMARY:-CodeQL: summary unavailable}"
            echo "- Report for this run: https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/runs/${GITHUB_RUN_NUMBER}/"
            echo "- Latest report: https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/latest/"
            echo "- Offline copy: download the \`allure-report.html\` artifact from this run and open it in a browser."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Publish: pushes the generated report to the gh-pages branch. This is the only job with write
  # access to the repository contents, so it runs nothing but GitHub's own actions and git:
  # no package installs and no code from the pull request.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Report
    needs: [report]
    if: always() && needs.report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the generated report to the gh-pages branch
    # Serialise publishing so parallel runs don't race on the gh-pages branch.
    concurrency:
      group: allure-gh-pages
      cancel-in-progress: false
    env:
      REPORT_HISTORY_RUNS: 20
    steps:
      - name: Download report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allure-report-site
          path: allure-report

      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gh-pages

      - name: Switch to gh-pages (create it on first run)
        working-directory: gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages:gh-pages
            git switch gh-pages
          else
            git switch --orphan gh-pages
          fi

      - name: Publish report to gh-pages
        working-directory: gh-pages
        run: |
          rm -rf "runs/${GITHUB_RUN_NUMBER}" latest
          mkdir -p runs
          cp -r ../allure-report "runs/${GITHUB_RUN_NUMBER}"
          cp -r ../allure-report latest

          # Keep only the most recent runs so the branch doesn't grow forever.
          ls -1 runs | sort -n | head -n "-${REPORT_HISTORY_RUNS}" | xargs -r -I{} rm -rf "runs/{}"

          echo '<meta http-equiv="refresh" content="0; url=latest/">' > index.html
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No report changes to publish."
            exit 0
          fi
          git commit -m "Allure report for run #${GITHUB_RUN_NUMBER}"
          git push origin gh-pages

  # ---------------------------------------------------------------------------
  # Stage 2: Deploy — enable auto-merge into main, only when the Test stage succeeded.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (merge to main)
    # Waits for both the tests and the CodeQL severity gate.
    needs: [test, codeql]
    # Dependency updates from Dependabot are tested but merged by hand after review. The PR author is
    # checked, not github.actor: the actor changes to whoever re-runs the workflow or pushes to the branch.
    if: >
      github.event_name == 'pull_request' &&
      needs.test.result == 'success' &&
      needs.codeql.result == 'success' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # --auto enables GitHub auto-merge: the PR merges once branch protection is satisfied
      # (required reviews and the required "Test" check). --match-head-commit refuses to enable it
      # if anything was pushed after the tested commit. Without branch protection on main, --auto
      # merges straight away, so keep the "Protecting Main" ruleset active.
      - name: Enable auto-merge into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge \
            --match-head-commit "$HEAD_SHA"
